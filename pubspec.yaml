name: estudiar
description: "App de gestión de evaluaciones escolares con IA."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  google_fonts: ^8.1.0
  http: ^1.2.0
  uuid: ^4.3.3
  flutter_slidable: ^4.0.3
  timezone: ^0.11.0
  image_picker: ^1.0.7
  file_picker: ^10.0.0
  permission_handler: ^12.0.3
  table_calendar: ^3.1.2
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  json_schema: ^5.1.1
  rxdart: ^0.28.0
  device_info_plus: ^12.4.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true